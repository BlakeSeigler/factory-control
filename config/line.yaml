# Line configuration: the single source of truth for every process.
#
# Material path (docs/architecture.md):
#   refill -> shredder -> extruder -> water bath -> pelletizer -> pellets
#
# Scaffold: only values that code reads today. Model parameters are added with the
# models that use them (docs/plant-model.md). All numbers are placeholders.

line:
  name: recycling-line-1
  material_path: [shredder, extruder, water_bath, pelletizer]

sim:
  physics_dt_s: 0.01          # plant integration step
  publish_period_s: 0.1       # how often PLCs update their OPC UA values
  time_scale: 1.0             # 1.0 = real time; >1 runs faster than wall clock (D-06)
  seed: 42

devices:
  - id: shredder
    type: shredder
    opcua:
      endpoint: opc.tcp://127.0.0.1:4841/factory/shredder
    hopper:                   # weighed by a load cell (D-03)
      capacity_kg: 200.0
      low_switch_kg: 40.0
      high_switch_kg: 160.0
      initial_kg: 120.0
    motor:
      max_rpm: 1800.0
    motor_thermal:
      initial_c: 25.0
    vibration:
      sample_rate_hz: 2560.0
      block_size: 1024

  - id: extruder
    type: extruder
    opcua:
      endpoint: opc.tcp://127.0.0.1:4842/factory/extruder
    hopper:
      capacity_kg: 50.0
      low_switch_kg: 10.0
      high_switch_kg: 40.0
      initial_kg: 25.0
    motor:
      max_rpm: 1800.0
    motor_thermal:
      initial_c: 25.0
    vibration:
      sample_rate_hz: 2560.0
      block_size: 1024
    barrel:
      initial_c: 25.0
      setpoint_c: 200.0
      max_setpoint_c: 280.0

  - id: water_bath
    type: water_bath
    opcua:
      endpoint: opc.tcp://127.0.0.1:4843/factory/water_bath
    bath:
      initial_c: 20.0

  - id: pelletizer
    type: pelletizer
    opcua:
      endpoint: opc.tcp://127.0.0.1:4844/factory/pelletizer
    motor:
      max_rpm: 1800.0
    motor_thermal:
      initial_c: 25.0

supervisor:
  db_path: data/factory.db
  subscription_period_ms: 100
  historian_flush_period_s: 1.0
  control:
    mode: manual              # manual | baseline | mpc
    period_s: 1.0

dashboard:
  host: 127.0.0.1
  port: 8000
  default_window_s: 600
