[project]
name = "factory-control"
version = "0.1.0"
description = "Simulated plastics recycling line (shredder, extruder, water bath, pelletizer) with per-device OPC UA PLCs, supervisor, historian and dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncua>=2.1",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
fc = "factory_control.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_control"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
